# The whole test suite, on the three systems robot makers actually use.
#
# The simulator renders camera frames, which needs an OpenGL context even with no window.
# None of the hosted runners has a GPU. Linux renders through EGL on Mesa's llvmpipe, Windows
# uses Mesa's llvmpipe, and the macOS VM cannot render at all (see the step below).
# The `llm` tests need the local Gemma weights and are left to a Mac.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Headless OpenGL (Linux, Mesa EGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libegl-mesa0 libgles2
          echo "MUJOCO_GL=egl" >> "$GITHUB_ENV"
          echo "PYOPENGL_PLATFORM=egl" >> "$GITHUB_ENV"
      - name: Software OpenGL (Windows)
        # The hosted Windows VM has only the basic display driver (OpenGL 1.1), which MuJoCo
        # cannot use: gladLoadGL fails. Mesa's llvmpipe provides a full OpenGL on the CPU.
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3
      - name: No OpenGL on the macOS VM
        # GitHub's macOS runners have no GPU and CGL refuses a pixel format. Rendering tests
        # that fail for that reason are reported as skipped (tests/conftest.py); the rest run.
        # They run with rendering on real Macs.
        if: runner.os == 'macOS'
        run: echo "PYUNTO_TEST_NO_GL=1" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        timeout-minutes: 40
        run: python -m pytest -q -m "not llm" --durations=15
      - name: URDF example
        run: python examples/urdf_robot.py --check
