# Publishes to PyPI when a GitHub release is published.
# Uses PyPI Trusted Publishing: no API token is stored in this repository. PyPI trusts this
# workflow file, in this repository, running in the `pypi` environment -- nothing else.
name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual dry run: builds and smoke-tests, never publishes.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the built wheel
        # The test suite is not run here: even the fast tests render camera frames, and MuJoCo
        # aborts without an OpenGL context, which the runner does not have (v0.1.0's first run
        # died this way). Run `pytest -m "not llm"` (and the llm tests) on a Mac before tagging.
        # What this does check: the wheel installs from PyPI-style metadata, the CLI starts,
        # and every bundled robot and its scene files are in the package.
        run: |
          python -m pip install dist/*.whl
          pyunto-robotics --help
          pyunto-robotics robots | tee robots.txt
          for r in solar watch pet mars orchard hotel; do grep -q "$r" robots.txt || { echo "missing robot: $r"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyunto-robotics
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
