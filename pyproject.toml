[project]
name = "pyunto-robotics"
version = "0.2.0"
description = "Talk to a robot from the Pyunto diary app. Simulated robots included; bring your own with one interface."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Utagoe Inc."}]
keywords = ["pyunto", "robotics", "robot", "mujoco", "simulation", "llm", "e2ee", "diary"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Pyunto transport, E2EE identity and the message bridge. Deliberately a dependency rather
    # than a copy: an earlier vendored copy went stale and could not read spaces created after
    # August 2026. requests / socketio / cryptography / dotenv all arrive through this.
    #
    # From PyPI since 0.1.0. (Before that it was a git URL, which also kept this package off
    # PyPI: PyPI rejects direct-URL dependencies.)
    # The [qr] extra is not optional here. `showqr` is the documented first step -- the whole
    # flow is "scan this square" -- and without qrcode it prints a JSON blob instead, which
    # cannot be scanned by anything. An extra is right for the agent, where pairing is one
    # feature among several; for the robot SDK it is the way in.
    "pyunto-agent[qr]>=0.1.4",
    # Simulation. Capped below 3.13: from 3.13 the pet robot can no longer reach the cat
    # tree (tests/test_pet_watch.py::test_it_can_reach_every_place_including_the_kitchen,
    # 2026-09-29). Lift the cap once the navigation is re-tuned against the newer physics.
    "mujoco>=3.11.0,<3.13",
    "numpy>=2.0",
    # Imaging
    "pillow>=10.3",
]

[project.optional-dependencies]
# Local LLM/VLM on Apple Silicon. Split out because the weights are large. The markers keep
# `pip install pyunto-robotics[llm]` from failing to build on Intel, Linux or Python 3.13+ --
# it simply installs nothing there. (This constraint used to sit on requires-python, which let
# an optional extra dictate the floor for every user.)
llm = [
    "mlx>=0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.6.10; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version < '3.13'",
]
# Phase 6: RL locomotion training (rollouts on CPU, gradient updates on MPS)
train = [
    "torch>=2.9",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Recording runs for upload to Artefacts. imageio-ffmpeg vendors the encoder, so the runner
# image does not need a system ffmpeg.
report = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.urls]
Homepage = "https://pyunto.com"
Repository = "https://github.com/utagoeinc/pyunto-robotics"
Issues = "https://github.com/utagoeinc/pyunto-robotics/issues"

[project.scripts]
pyunto-robotics = "pyunto_robotics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyunto_robotics"]
# Scene XML and meshes live inside the package so an installed wheel has a working robot.
artifacts = ["pyunto_robotics/assets/**"]

[tool.hatch.build.targets.sdist]
include = ["pyunto_robotics", "examples", "README.md"]
exclude = ["**/__pycache__"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: drives the full simulator end to end (deselect with -m 'not slow')",
    "llm: needs the local Gemma weights on disk",
    "needs_gl: renders camera frames and cannot pass without an OpenGL context (skipped when PYUNTO_TEST_NO_GL=1)",
]
